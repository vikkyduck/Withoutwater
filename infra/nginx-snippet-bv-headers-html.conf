# Заголовки HTML-страниц: безопасность + точки входа для агентов.
include snippets/bv-headers.conf;

# RFC 8288 (Web Linking): куда идти агенту, пришедшему на страницу.
# Перечислены ТОЛЬКО существующие адреса — битая ссылка в заголовке хуже,
# чем её отсутствие. rel-типы из реестра IANA Link Relations.
# api-catalog и service-doc намеренно не объявляем: публичного API у сайта нет.
add_header Link '</sitemap.xml>; rel="sitemap", </faq/>; rel="help", </team/>; rel="author", </politics_pd/>; rel="privacy-policy", </pub_oferta/>; rel="terms-of-service"' always;
