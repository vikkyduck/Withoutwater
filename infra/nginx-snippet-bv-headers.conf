# Общие заголовки withoutwater.ru.
#
# ВАЖНО про nginx: add_header НЕ наследуется в location, где объявлен свой
# add_header. Из-за этого три заголовка безопасности со server-уровня
# пропадали на всех HTML-страницах (у них свой Cache-Control) — проверено
# 13.08.2026: на / и /cases/ их не было. Поэтому набор вынесен сюда и
# подключается в КАЖДЫЙ location со своим add_header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
