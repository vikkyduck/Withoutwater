server {
    server_name withoutwater.ru www.withoutwater.ru;

    root /opt/withoutwater/site;
    index index.html;
    charset utf-8;

    include snippets/bv-headers-html.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # страница старого сайта, которой больше нет
    location = /project_sales.html { return 301 /#products; }

    # Раздел переехал (финальная структура 02.08): постоянный редирект
    location ~ ^/for-your-boss/?$ { return 301 https://withoutwater.ru/business-effect/; }

    # PDF раздела «Бизнес-эффект»: пересобираются при деплое, кэш недолгий
    location /pdf/ {
        include snippets/bv-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Ассеты с хэшем в имени — можно кэшировать навсегда
    location /assets/ {
        include snippets/bv-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML не кэшируем: иначе после деплоя посетитель видит старую страницу
    # со ссылкой на старый бандл. Проверено 31.07 — правки не доезжали.
    location ~* \.html$ {
        include snippets/bv-headers-html.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        include snippets/bv-headers-html.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    error_page 404 /404.html;

    # Прототип «Лунарио» — отдельная папка, деплой сайта (rsync --delete) его не трогает.
    # ^~ обязателен: иначе location ~* \.html\$ перехватит index.html с чужим root.
    location ^~ /lunario/ {
        alias /opt/lunario/;
        index index.html;
        include snippets/bv-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /lunario { return 301 /lunario/; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/woff2;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/withoutwater.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/withoutwater.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.withoutwater.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = withoutwater.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    server_name withoutwater.ru www.withoutwater.ru;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
