server {
    server_name withoutwater.ru;

    root /opt/withoutwater/site;
    index index.html;
    charset utf-8;
    server_tokens off;

    include snippets/bv-headers-html.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # страница старого сайта, которой больше нет
    location = /project_sales.html { return 301 /#when; }

    # Раздел переехал (финальная структура 02.08): постоянный редирект
    location ~ ^/for-your-boss/?$ { return 301 https://withoutwater.ru/business-effect/; }

    # Хаб /tasks снят 17.09.2026 (редакция текстов Виктории): три услуги
    # живут карточками на главной. Сами страницы /tasks/... остаются.
    location ~ ^/tasks/?$ { return 301 https://withoutwater.ru/#when; }

    # PDF раздела «Бизнес-эффект»: пересобираются при деплое, кэш недолгий
    location /pdf/ {
        include snippets/bv-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Ассеты с хэшем в имени — можно кэшировать навсегда.
    # ^~ — чтобы регэксп для картинок ниже не перебил immutable.
    location ^~ /assets/ {
        include snippets/bv-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты, картинки, иконки: без заголовка браузер перепроверял их на
    # каждой странице (аудит 17.09.2026). Имена без хэша — месяц, не год.
    location ~* \.(woff2|woff|webp|jpg|jpeg|png|svg|ico)$ {
        include snippets/bv-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /fonts/fonts.css {
        include snippets/bv-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML не кэшируем: иначе после деплоя посетитель видит старую страницу
    # со ссылкой на старый бандл. Проверено 31.07 — правки не доезжали.
    location ~* \.html$ {
        include snippets/bv-headers-html.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        include snippets/bv-headers-html.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    error_page 404 /404.html;

    # Прототип «Лунарио» — отдельная папка, деплой сайта (rsync --delete) его не трогает.
    # ^~ обязателен: иначе location ~* \.html\$ перехватит index.html с чужим root.
    # Радары «Без Воды» — опросы под конкретную встречу:
    # withoutwater.ru/radar/18072026 открывает радар с уже подставленным кодом
    # группы, поэтому ответы разных встреч не смешиваются.
    # ^~ обязателен: иначе location ~* \\.html$ перехватит index.html с чужим root.
    # Бэкенд радаров — отдельный от бэкенда сайта.
    location ^~ /radar/api/ {
        proxy_pass http://127.0.0.1:5040/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /radar/ {
        alias /opt/leader-navigator/dist/;
        try_files $uri $uri/ /radar/index.html;

        # index.html нельзя кэшировать: он указывает на файлы со свежими
        # именами, и закэшированный отправляет браузер за старой сборкой —
        # выкатка становится невидимой. Сами файлы с хэшем в имени вечны.
        location = /radar/index.html {
            alias /opt/leader-navigator/dist/index.html;
            add_header Cache-Control "no-cache";
        }
        location ^~ /radar/assets/ {
            alias /opt/leader-navigator/dist/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location = /radar { return 301 /radar/; }

    # Прототип переехал на lunario.online. Папку /opt/lunario/ наружу НЕ отдаём:
    # с 05.08 там же живут бэкенд лендинга и база заявок.
    location ^~ /lunario {
        return 301 https://lunario.online/prototype/;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # woff2 уже сжат — в gzip_types ему не место
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/withoutwater.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/withoutwater.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
# www — постоянный редирект на основной домен: иначе https://www… отдавал
# полную копию сайта (дубль для поисковика). Сертификат покрывает оба имени.
server {
    server_name www.withoutwater.ru;
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/withoutwater.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/withoutwater.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://withoutwater.ru$request_uri;
}
server {
    if ($host = www.withoutwater.ru) {
        return 301 https://withoutwater.ru$request_uri;
    } # managed by Certbot
    if ($host = withoutwater.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    server_name withoutwater.ru www.withoutwater.ru;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
